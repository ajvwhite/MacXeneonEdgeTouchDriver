name: Installer safety

on:
  push:
    paths:
      - Scripts/install.sh
      - Scripts/prepare-install.swift
      - Scripts/test-install.py
      - Resources/com.ajvwhite.MacXeneonEdgeTouchDriver.plist.template
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - Scripts/install.sh
      - Scripts/prepare-install.swift
      - Scripts/test-install.py
      - Resources/com.ajvwhite.MacXeneonEdgeTouchDriver.plist.template
      - .github/workflows/installer.yml

permissions:
  contents: read

jobs:
  installer-safety:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check installer shell syntax
        run: /bin/sh -n Scripts/install.sh
      - name: Check staged installation and serialization
        run: python3 Scripts/test-install.py
