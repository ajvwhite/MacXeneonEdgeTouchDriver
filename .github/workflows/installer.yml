name: Installer safety

on:
  push:
    paths:
      - Scripts/install.sh
      - Scripts/prepare-install.swift
      - Scripts/test-install.py
      - Scripts/build-portable-installer.sh
      - Scripts/PortableInstaller.swift
      - Scripts/test-portable-installer.py
      - Resources/PortableInstaller/**
      - Scripts/uninstall.sh
      - Scripts/test-uninstall.py
      - Resources/com.ajvwhite.MacXeneonEdgeTouchDriver.plist.template
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - Scripts/install.sh
      - Scripts/prepare-install.swift
      - Scripts/test-install.py
      - Scripts/build-portable-installer.sh
      - Scripts/PortableInstaller.swift
      - Scripts/test-portable-installer.py
      - Resources/PortableInstaller/**
      - Scripts/uninstall.sh
      - Scripts/test-uninstall.py
      - Resources/com.ajvwhite.MacXeneonEdgeTouchDriver.plist.template
      - .github/workflows/installer.yml

permissions:
  contents: read

jobs:
  installer-safety:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check installer and uninstaller shell syntax
        run: |
          /bin/sh -n Scripts/install.sh
          /bin/sh -n Scripts/uninstall.sh
          /bin/sh -n Scripts/build-portable-installer.sh
      - name: Check staged installation and serialization
        run: python3 Scripts/test-install.py
      - name: Check guarded uninstall failure handling
        run: python3 Scripts/test-uninstall.py
      - name: Check the portable installer app compiles
        run: xcrun swiftc -typecheck -target "$(uname -m)-apple-macosx13.0" Scripts/PortableInstaller.swift
      - name: Check portable packaging without signing or installing
        run: python3 Scripts/test-portable-installer.py
